
name: Mirror Website to Repository Root

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

concurrency:
  group: website-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Create crawler
        shell: bash
        run: |
          cat > mirror.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";
          import path from "node:path";
          import crypto from "node:crypto";

          const start = "https://d2mxyt8j2p6hed.cloudfront.net/";
          const origin = new URL(start).origin;
          const root = process.cwd();
          const queue = [start];
          const visited = new Set();
          const resources = new Map();
          const pending = new Set();
          const maxPages = 40;

          function destination(raw) {
            const u = new URL(raw);
            let pathname = decodeURIComponent(u.pathname);

            if (!pathname || pathname.endsWith("/")) {
              pathname += "index.html";
            }

            pathname = pathname.replace(/^\/+/, "");

            if (
              pathname.split("/").some(
                p => p === "." || p === ".."
              ) ||
              pathname === ".git" ||
              pathname.startsWith(".git/")
            ) {
              throw new Error("Unsafe path");
            }

            let relative = pathname;

            if (u.origin !== origin) {
              relative = path.posix.join(
                "_external",
                u.host,
                pathname
              );
            }

            if (u.search) {
              const ext = path.posix.extname(relative);
              const base = relative.slice(
                0,
                relative.length - ext.length
              );
              const hash = crypto
                .createHash("sha256")
                .update(u.search)
                .digest("hex")
                .slice(0, 12);

              relative = `${base}.${hash}${ext}`;
            }

            const absolute = path.resolve(root, relative);

            if (!absolute.startsWith(root + path.sep)) {
              throw new Error("Path outside repository");
            }

            return absolute;
          }

          async function save(url, body, type) {
            const parsed = new URL(url);

            // Don't save application routes as extensionless files.
            // Vercel will route these paths to index.html.
            if (
              /text\/html/i.test(type || "") &&
              parsed.origin === origin &&
              parsed.pathname !== "/" &&
              !parsed.pathname.endsWith(".html")
            ) {
              console.log(
                "Skipping HTML route file:",
                parsed.pathname
              );
              return;
            }

            const file = destination(url);

            await fs.mkdir(path.dirname(file), {
              recursive: true
            });

            await fs.writeFile(file, body);

            resources.set(url, {
              file,
              type: type || ""
            });

            console.log(
              "Saved:",
              path.relative(root, file)
            );
          }

          const browser = await chromium.launch({
            headless: true
          });

          const context = await browser.newContext();
          const page = await context.newPage();

          page.on("response", response => {
            const task = (async () => {
              try {
                if (response.status() !== 200) return;

                const url = response.url();

                if (!/^https?:\/\//i.test(url)) return;

                const headers = await response.allHeaders();
                const type = headers["content-type"] || "";

                if (!/(text\/html|text\/css|javascript|json|image\/|font\/|application\/wasm|application\/octet-stream)/i.test(type)) {
                  return;
                }

                const body = await response.body();
                await save(url, body, type);
              } catch (error) {
                console.log(
                  "Resource skipped:",
                  response.url(),
                  String(error).slice(0, 150)
                );
              }
            })();

            pending.add(task);
            task.finally(() => pending.delete(task));
          });

          while (
            queue.length > 0 &&
            visited.size < maxPages
          ) {
            const url = queue.shift();

            if (visited.has(url)) continue;
            visited.add(url);

            console.log("Visiting:", url);

            try {
              await page.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 45000
              });

              await page.waitForTimeout(2500);

              const html = await page.content();

              // Save the actual homepage at the repository root.
              if (url === start) {
                await fs.writeFile(
                  path.join(root, "index.html"),
                  html
                );
              }

              // Collect normal navigation links and iframe URLs.
              const links = await page.locator(
                "a[href], iframe[src]"
              ).evaluateAll(elements =>
                elements.map(el => el.href || el.src)
                  .filter(Boolean)
              );

              for (const link of links) {
                try {
                  const next = new URL(link);
                  next.hash = "";

                  if (
                    next.origin === origin &&
                    !visited.has(next.href) &&
                    queue.length < 200
                  ) {
                    queue.push(next.href);
                  }
                } catch {}
              }
            } catch (error) {
              console.log(
                "Page failed:",
                url,
                String(error).slice(0, 200)
              );
            }
          }

          // Wait for response handlers to finish saving files.
          await Promise.allSettled([...pending]);
          await browser.close();

          // Rewrite captured absolute URLs in HTML and CSS only.
          // JavaScript files are left untouched to avoid breaking
          // client-side navigation and download handlers.
          for (const [url, resource] of resources) {
            if (!/(text\/html|text\/css)/i.test(resource.type)) {
              continue;
            }

            let content;

            try {
              content = await fs.readFile(
                resource.file,
                "utf8"
              );
            } catch {
              continue;
            }

            if (content.includes("\u0000")) continue;

            for (const [original, target] of resources) {
              const relative = path.relative(
                path.dirname(resource.file),
                target.file
              ).split(path.sep).join("/");

              const local = relative.startsWith(".")
                ? relative
                : "./" + relative;

              content = content.split(original).join(local);
            }

            await fs.writeFile(resource.file, content);
          }

          console.log("Pages visited:", visited.size);
          console.log("Resources saved:", resources.size);
          console.log("Homepage:", path.join(root, "index.html"));

          if (!(await fs.stat(
            path.join(root, "index.html")
          )).isFile()) {
            throw new Error("Homepage was not created.");
          }
          EOF

      - name: Crawl website
        run: node mirror.mjs

      - name: Remove duplicate route files
        shell: bash
        run: |
          # Only remove generated files when their contents
          # exactly match the main index.html.
          for file in ai settings terms privacy credits bookmarks history; do
            if [ -f "$file" ] && cmp -s index.html "$file"; then
              rm "$file"
              echo "Removed duplicate route: $file"
            fi
          done

      - name: Verify mirror
        run: |
          test -s index.html

          echo "=== Homepage ==="
          ls -lh index.html

          echo "=== File count ==="
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' | wc -l

          echo "=== Root files ==="
          ls -la

      - name: Commit mirrored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Don't publish dependencies or crawler source.
          rm -rf node_modules
          git add -A
          git reset -- mirror.mjs package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update website mirror"
            git push
          fi
