
name: Mirror Website to Repository Root

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

concurrency:
  group: website-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium


      - name: Create website crawler
        shell: bash
        run: |
          cat > mirror.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";
          import path from "node:path";
          import crypto from "node:crypto";

          const start = "https://d2mxyt8j2p6hed.cloudfront.net/";
          const origin = new URL(start).origin;
          const root = process.cwd();
          const visited = new Set();
          const queue = [start];
          const resources = new Map();
          const maxPages = 40;

          function destination(raw) {
            const url = new URL(raw);
            let pathname = decodeURIComponent(url.pathname);

            if (!pathname || pathname.endsWith("/")) {
              pathname += "index.html";
            }

            pathname = pathname.replace(/^\/+/, "");

            if (
              pathname.split("/").some(part =>
                part === "." || part === ".."
              ) ||
              pathname.startsWith(".git/") ||
              pathname === ".git"
            ) {
              throw new Error("Unsafe resource path");
            }

            let relative = pathname;

            // Keep external resources in the repository too,
            // without mixing their paths with the main website.
            if (url.origin !== origin) {
              relative = path.posix.join(
                "_external",
                url.host,
                pathname
              );
            }

            if (url.search) {
              const ext = path.posix.extname(relative);
              const base = relative.slice(
                0, relative.length - ext.length
              );
              const hash = crypto
                .createHash("sha256")
                .update(url.search)
                .digest("hex")
                .slice(0, 12);

              relative = `${base}.${hash}${ext}`;
            }

            const absolute = path.resolve(root, relative);

            if (
              absolute !== root &&
              !absolute.startsWith(root + path.sep)
            ) {
              throw new Error("Path outside repository");
            }

            return absolute;
          }

          async function save(url, body, type) {
            let file;

            try {
              file = destination(url);
            } catch (error) {
              console.log("Skipped path:", url, String(error));
              return;
            }

            await fs.mkdir(path.dirname(file), {
              recursive: true
            });

            await fs.writeFile(file, body);
            resources.set(url, {
              file,
              type: type || ""
            });

            console.log("Saved:", path.relative(root, file));
          }

          const browser = await chromium.launch({
            headless: true
          });

          const context = await browser.newContext();
          const page = await context.newPage();

          page.setDefaultTimeout(15000);

          page.on("response", async response => {
            try {
              if (response.status() !== 200) return;

              const url = response.url();

              if (!/^https?:\/\//i.test(url)) return;

              const headers = await response.allHeaders();
              const type = headers["content-type"] || "";

              if (!/(text\/html|text\/css|javascript|json|image\/|font\/|application\/wasm|application\/octet-stream)/i.test(type)) {
                return;
              }

              const body = await response.body();

              await save(url, body, type);
            } catch (error) {
              console.log(
                "Resource unavailable:",
                response.url(),
                String(error).slice(0, 150)
              );
            }
          });

          while (queue.length && visited.size < maxPages) {
            const url = queue.shift();

            if (visited.has(url)) continue;
            visited.add(url);

            console.log("Crawling:", url);

            try {
              await page.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 45000
              });

              // Give client-side JavaScript time to load assets.
              await page.waitForTimeout(4000);

              const html = await page.content();
              await save(
                url,
                Buffer.from(html),
                "text/html"
              );

              const links = await page.locator(
                "a[href], iframe[src]"
              ).evaluateAll(elements =>
                elements.map(element =>
                  element.href || element.src
                ).filter(Boolean)
              );

              for (const link of links) {
                try {
                  const next = new URL(link);
                  next.hash = "";

                  if (
                    next.origin === origin &&
                    !visited.has(next.href) &&
                    queue.length < 200
                  ) {
                    queue.push(next.href);
                  }
                } catch {}
              }
            } catch (error) {
              console.log(
                "Page failed:",
                url,
                String(error).slice(0, 200)
              );
            }
          }

          await browser.close();

          // Rewrite captured absolute resource URLs to local files.
          // Files retain their paths relative to the repository root.
          for (const [url, resource] of resources) {
            if (!/(text\/html|text\/css|javascript)/i.test(resource.type)) {
              continue;
            }

            let content;

            try {
              content = await fs.readFile(resource.file, "utf8");
            } catch {
              continue;
            }

            if (content.includes("\u0000")) continue;

            for (const [original, target] of resources) {
              const relative = path.relative(
                path.dirname(resource.file),
                target.file
              ).split(path.sep).join("/");

              const local = relative.startsWith(".")
                ? relative
                : "./" + relative;

              content = content.split(original).join(local);
            }

            await fs.writeFile(resource.file, content);
          }

          // Ensure the requested homepage is at the repository root.
          const homepage = resources.get(start);

          if (homepage) {
            const source = await fs.readFile(homepage.file);
            await fs.writeFile(
              path.join(root, "index.html"),
              source
            );
          } else {
            throw new Error(
              "Homepage was not captured. Check the crawl logs."
            );
          }

          console.log("--------------------------------");
          console.log("Pages visited:", visited.size);
          console.log("Resources captured:", resources.size);
          console.log("Mirror destination: repository root");
          console.log("--------------------------------");
          EOF

      - name: Crawl and mirror website
        run: node mirror.mjs

      - name: Verify downloaded files
        run: |
          echo "=== Root homepage ==="
          test -s index.html
          ls -lh index.html

          echo "=== File count ==="
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            | wc -l

          echo "=== Downloaded assets ==="
          find assets css js images fonts _external \
            -type f 2>/dev/null | head -100 || true

          echo "=== Root directory ==="
          ls -la

      - name: Commit mirrored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -A

          # Keep workflow and crawler source under version control
          # without accidentally committing generated package files.
          git reset -- mirror.mjs package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
          else
            git commit -m "Update website mirror"
            git push
          fi
